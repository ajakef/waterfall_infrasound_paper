name: waterfall
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Core scientific stack (compiled → conda)
  - numpy=1.26
  - scipy=1.11
  - pandas=2.2
  - matplotlib=3.8

  # Niagara figures
  - rasterio=1.3

  # obspy 1.4.2 is incompatible with later versions of setuptools due to pkg_resources deprecation
  - setuptools=81.*
  - odfpy=1.4*

  # pip section for things conda doesn’t handle well
  - pip
  - pip:
      - obspy==1.4.*
      - gemlog==1.7.*